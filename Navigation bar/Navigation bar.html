<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar</title>
    <style>
        body{
            margin: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .topnav{
            overflow: hidden;
            background-color: navy;
        }
        .topnav a{
            float: left;
            color: salmon;
            text-align: center;
            padding: 14px 16px ;
            text-decoration: lightcoral;
            font-size: 17px;
        }
        .topnav a:hover{
            background-color: pink;
            color: rgb(35, 232, 232);
        }
       .topnav a.active{
        background-color: lightpink;
            color: rgb(7, 145, 145);
       } 
    </style>
</head>
<body>
    <div class="topnav">
<a class="active" href="#home">home</a>
<a href="#">about us</a>
<a href="#">gallery</a>
<a href="#"> contact us</a>
    </div>
</body>
</html>
